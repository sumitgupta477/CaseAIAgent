# Runs the LLM regression eval and fails if quality drifts from evals/baseline.json.
#
# - On pull requests that touch the agent or the eval: catches regressions from
#   prompt or code changes before they merge.
# - Weekly: catches drift with no code change at all, e.g. the model provider
#   silently updating the model behind the same name.
#
# Model access, in order of preference:
#   1. OPENAI_API_KEY repository secret: calls OpenAI directly, like the Lambda.
#   2. No secret: uses GitHub Models (free, OpenAI-compatible) with the
#      workflow's own GITHUB_TOKEN, so the eval runs with zero setup.
#      Free-tier rate limits apply, so it runs each test once, one at a time.
# Optional: the AWS_EVAL_ROLE_ARN secret (the eval_role_arn Terraform output)
# publishes scheduled and manual runs to CloudWatch, where an alarm emails you
# on drift. Pull request runs are never published, so unmerged changes can't
# trigger the production alarm.

name: LLM eval drift check

on:
  pull_request:
    paths:
      - "Backend/terraform_code/backend/**"
      - "evals/**"
      - ".github/workflows/llm-eval-drift.yml"
  schedule:
    - cron: "17 9 * * 1" # Mondays 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  models: read # GitHub Models, used when no OPENAI_API_KEY secret is set
  id-token: write # for AWS OIDC (CloudWatch publishing)

concurrency:
  group: llm-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AWS_EVAL_ROLE_ARN: ${{ secrets.AWS_EVAL_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      PUBLISH_TO_CLOUDWATCH: ${{ github.event_name != 'pull_request' && secrets.AWS_EVAL_ROLE_ARN != '' }}
      PROMPTFOO_VERSION: "0.125.1"
      PROMPTFOO_DISABLE_TELEMETRY: "1"
      PROMPTFOO_DISABLE_UPDATE: "1"
      # Let drift_check.py decide pass/fail instead of promptfoo's own exit code.
      PROMPTFOO_FAILED_TEST_EXIT_CODE: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Choose the model endpoint
        env:
          GH_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "Using the OpenAI API (OPENAI_API_KEY secret)."
            echo "EVAL_ARGS=--repeat 3" >> "$GITHUB_ENV"
          else
            echo "::notice::No OPENAI_API_KEY secret; using GitHub Models (gpt-4o-mini) with GITHUB_TOKEN."
            {
              echo "OPENAI_API_KEY=$GH_MODELS_TOKEN"
              echo "OPENAI_BASE_URL=https://models.github.ai/inference"
              echo "OPENAI_MODEL=openai/gpt-4o-mini"
              echo "EVAL_GRADER=openai:chat:openai/gpt-4o-mini"
              # Free tier: about 15 requests a minute, so one at a time with a pause.
              echo "EVAL_ARGS=--repeat 1 --max-concurrency 1 --delay 4500"
            } >> "$GITHUB_ENV"
          fi

      - name: TEMP diagnose GitHub Models endpoint
        env:
          GH_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY='{"model":"openai/gpt-4o-mini","messages":[{"role":"user","content":"Say hi"}],"max_tokens":10}'
          try() { echo "== $1"; curl -sS -o /tmp/o.txt -w "status=%{http_code} type=%{content_type}\n" -X POST "$2" -H "Authorization: Bearer $GH_MODELS_TOKEN" -H "Content-Type: application/json" "${@:3}" -d "$BODY"; head -c 300 /tmp/o.txt; echo; }
          try plain https://models.github.ai/inference/chat/completions
          try versioned https://models.github.ai/inference/chat/completions -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2026-03-10"
          try azure https://models.inference.ai.azure.com/chat/completions
          echo "== catalog"; curl -sS -o /tmp/c.txt -w "status=%{http_code}\n" https://models.github.ai/catalog/models -H "Authorization: Bearer $GH_MODELS_TOKEN"; head -c 300 /tmp/c.txt; echo

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: aws-actions/configure-aws-credentials@v4
        if: env.PUBLISH_TO_CLOUDWATCH == 'true'
        with:
          role-to-assume: ${{ env.AWS_EVAL_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install backend dependencies
        working-directory: Backend/terraform_code/backend
        run: npm ci

      - name: Run eval
        run: |
          mkdir -p evals/results
          npx -y "promptfoo@${PROMPTFOO_VERSION}" eval \
            -c evals/promptfooconfig.yaml \
            $EVAL_ARGS --no-cache --no-table \
            -o evals/results/latest.json

      - name: Compare with baseline
        run: |
          if [ "$PUBLISH_TO_CLOUDWATCH" = "true" ]; then
            export EVAL_CLOUDWATCH_NAMESPACE="LLMEval/CaseAIAgent"
          fi
          python3 evals/drift_check.py evals/results/latest.json

      - name: Print a candidate baseline (first run only)
        if: hashFiles('evals/baseline.json') == ''
        run: |
          python3 evals/drift_check.py evals/results/latest.json \
            --update-baseline --baseline /tmp/baseline.json
          echo "----- BEGIN CANDIDATE BASELINE -----"
          cat /tmp/baseline.json
          echo "----- END CANDIDATE BASELINE -----"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-eval-results
          path: evals/results/latest.json
          if-no-files-found: ignore
